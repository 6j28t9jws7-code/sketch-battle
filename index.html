
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Битва рисунков</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17152b;color:white;font-family:Arial,sans-serif;text-align:center;padding:24px}
main{max-width:500px;margin:35px auto;background:#252242;padding:25px;border-radius:22px}
h1{font-size:32px;color:#bca7ff}
p{color:#d4d0e9}
button,input{width:100%;padding:15px;margin:8px 0;border:0;border-radius:12px;font-size:16px}
button{background:#9270ff;color:white;font-weight:bold}
input{background:#fff;color:#222}
#room{display:none}
canvas{background:white;width:100%;height:280px;border-radius:12px;touch-action:none}
</style>
</head>
<body>
<main>
<h1>🎨 Битва рисунков</h1>
<p>Рисуй. Угадывай. Побеждай!</p>
<section id="menu">
<input id="nickname" placeholder="Твоё имя">
<button onclick="createRoom()">Создать комнату</button>
<input id="roomCode" placeholder="Код комнаты">
<button onclick="joinRoom()">Присоединиться</button>
<p>От 2 до 12 игроков</p>
</section>
<section id="room" >
<h2>Комната <span id="code"></span></h2>
<p id="status">Ты в комнате!</p>
<canvas id="canvas" width="600" height="350"></canvas>
<button onclick="clearCanvas()">Очистить рисунок</button>
<input id="guess" placeholder="Угадай слово">
<button onclick="sendGuess()">Ответить</button>
<p id="result"></p>
<button onclick="back()">В меню</button>
</section>
</main>
<script>
let currentCode="";
function createRoom(){
if(!document.getElementById('nickname').value.trim()){alert('Введи имя!');return}
currentCode=Math.random().toString(36).slice(2,7).toUpperCase();
openRoom();
}
function joinRoom(){
if(!document.getElementById('nickname').value.trim()){alert('Введи имя!');return}
let c=document.getElementById('roomCode').value.trim().toUpperCase();
if(!c){alert('Введи код комнаты!');return}
currentCode=c;openRoom();
}
function openRoom(){
document.getElementById('menu').style.display='none';
document.getElementById('room').style.display='block';
document.getElementById('code').textContent=currentCode;
}
function back(){
document.getElementById('room').style.display='none';
document.getElementById('menu').style.display='block';
}
function clearCanvas(){
let c=document.getElementById('canvas');
c.getContext('2d').clearRect(0,0,c.width,c.height);
}
let canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),drawing=false;
canvas.addEventListener('pointerdown',e=>{drawing=true;ctx.beginPath();let r=canvas.getBoundingClientRect();ctx.moveTo((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;let r=canvas.getBoundingClientRect();ctx.lineWidth=5;ctx.lineCap='round';ctx.strokeStyle='#252242';ctx.lineTo((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height);ctx.stroke()});
canvas.addEventListener('pointerup',()=>drawing=false);
canvas.addEventListener('pointerleave',()=>drawing=false);
function sendGuess(){
let g=document.getElementById('guess').value.trim();
document.getElementById('result').textContent=g?'Ответ отправлен: '+g:'Напиши свой ответ!';
}
</script>
</body>
</html>
